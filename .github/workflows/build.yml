name: build-simba
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o simba*.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - working-directory: src/simba-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/simba-android/app/build/outputs/apk/debug/app-debug.apk simba.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest simba.apk --title "Simba" --notes "latest"
